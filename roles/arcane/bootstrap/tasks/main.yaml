# ansible_path/roles/arcane/bootstrap/tasks/main.yaml
---
# The agent token is never written by hand and never stored in a var file.
# An agent enrols itself with a reusable enrollment token: the manager creates
# the environment on first contact, named after the Docker hostname the agent
# reports, and hands back an agent key the agent stores in `/app/data`.
#
# An enrollment token can be read back by id, so this role is idempotent: it
# looks the token up by name, creates it when missing, and nothing else. No
# environment is created here, and no token is rotated per run.
#
# In check mode no agent container is created, so there is nothing to enrol:
# the API tasks are skipped and `arcaneAgentToken` stays empty (the container
# task is a no-op in check mode anyway).
- name: ARCANE BOOTSTRAP | Reset the values resolved for this run
  ansible.builtin.set_fact:
    arcaneAgentToken: ''
    arcaneEnrollmentTokenId: ''
  no_log: true
  tags: [arcane, bootstrap]

- name: ARCANE BOOTSTRAP | List the enrollment tokens known by the manager
  ansible.builtin.uri:
    url: '{{ arcaneManagerApiUrl }}/api/enrollment-tokens'
    method: GET
    headers:
      X-API-Key: '{{ arcaneAdminApiKey }}'
  register: arcaneEnrollmentTokenList
  delegate_to: localhost
  changed_when: false
  failed_when: false
  no_log: true
  retries: '{{ arcaneBootstrapRetries }}'
  delay: '{{ arcaneBootstrapDelay }}'
  # Retrying is only useful while the answer is meaningless. A 401/403 will
  # never turn into a 200 by waiting, and neither will a 404: it means the
  # manager does not know the route at all. Only 5xx and connection errors are
  # worth a second attempt.
  until: arcaneEnrollmentTokenList.status | default(0) in [200, 401, 403, 404]
  when: not ansible_check_mode
  tags: [arcane, bootstrap]

- name: ARCANE BOOTSTRAP | Fail fast when the manager refuses the request
  ansible.builtin.fail:
    msg: >-
      {{ arcaneManagerApiUrl }}/api/enrollment-tokens answered
      {{ arcaneEnrollmentTokenList.status | default('no status') }}
      ({{ arcaneEnrollmentTokenList.msg | default('no message') }}).
      401 = the admin key is not accepted: Arcane only validates keys shaped
      'arc_' + 64 hex characters, and the static key is reconciled at startup
      by ARCANE_ADMIN_STATIC_API_KEY.
      404 = the manager has no /api/enrollment-tokens route, so it runs a
      version older than 3.0: the manager has to be on v3 before its agents.
      502 = Nginx Proxy Manager cannot reach the manager: check the vhost
      forward port (3552, not 3553).
  when:
    - not ansible_check_mode
    - arcaneEnrollmentTokenList.status | default(0) != 200
  tags: [arcane, bootstrap]

- name: ARCANE BOOTSTRAP | Look for the reusable enrollment token
  ansible.builtin.set_fact:
    arcaneEnrollmentTokenId: >-
      {{ (arcaneEnrollmentTokenList.json.data | default([])
         | selectattr('name', 'equalto', arcaneAgentTokenName) | list
         | first | default({}, true)).get('id', '') }}
  when:
    - not ansible_check_mode
    - arcaneEnrollmentTokenList.status | default(0) == 200
  tags: [arcane, bootstrap]

# --- reuse the token the manager already keeps ----------------------------
- name: ARCANE BOOTSTRAP | Read the enrollment token back
  ansible.builtin.uri:
    url: '{{ arcaneManagerApiUrl }}/api/enrollment-tokens/{{ arcaneEnrollmentTokenId }}/token'
    method: GET
    headers:
      X-API-Key: '{{ arcaneAdminApiKey }}'
    status_code: 200
  register: arcaneEnrollmentTokenSecret
  delegate_to: localhost
  changed_when: false
  when:
    - not ansible_check_mode
    - arcaneEnrollmentTokenId | length > 0
  no_log: true
  tags: [arcane, bootstrap]

# --- create it when the manager does not have it yet ----------------------
# `maxUses` is left unset, i.e. unlimited: several hosts enrol with this one
# token, and a host that loses its agent volume must be able to enrol again.
- name: ARCANE BOOTSTRAP | Create the reusable enrollment token
  ansible.builtin.uri:
    url: '{{ arcaneManagerApiUrl }}/api/enrollment-tokens'
    method: POST
    headers:
      X-API-Key: '{{ arcaneAdminApiKey }}'
    body_format: json
    body:
      name: '{{ arcaneAgentTokenName }}'
    status_code: [200, 201]
  register: arcaneEnrollmentTokenCreated
  delegate_to: localhost
  when:
    - not ansible_check_mode
    - arcaneEnrollmentTokenList.status | default(0) == 200
    - arcaneEnrollmentTokenId | length == 0
  no_log: true
  tags: [arcane, bootstrap]

- name: ARCANE BOOTSTRAP | Keep the enrollment token read back from the manager
  ansible.builtin.set_fact:
    arcaneAgentToken: '{{ arcaneEnrollmentTokenSecret.json.data.token }}'
  when:
    - not ansible_check_mode
    - not (arcaneEnrollmentTokenSecret.skipped | default(false))
  no_log: true
  tags: [arcane, bootstrap]

- name: ARCANE BOOTSTRAP | Keep the enrollment token created by the manager
  ansible.builtin.set_fact:
    arcaneAgentToken: '{{ arcaneEnrollmentTokenCreated.json.data.token }}'
  when:
    - not ansible_check_mode
    - not (arcaneEnrollmentTokenCreated.skipped | default(false))
  no_log: true
  tags: [arcane, bootstrap]

- name: ARCANE BOOTSTRAP | Fail when no enrollment token could be resolved
  ansible.builtin.fail:
    msg: >-
      No usable enrollment token named '{{ arcaneAgentTokenName }}' was
      returned by {{ arcaneManagerApiUrl }}/api/enrollment-tokens, although the
      API answered 200. Check the token in
      Agents -> Enrollment Tokens, and whether it was revoked.
  when:
    - not ansible_check_mode
    - arcaneAgentToken | length == 0
  tags: [arcane, bootstrap]
