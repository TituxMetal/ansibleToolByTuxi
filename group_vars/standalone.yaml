# ansible_path/group_vars/standalone.yaml

dockerServiceStandaloneNetwork: 'reverse-proxy-nw'
# dockerServicePortainerNetwork: 'portainer_default'
dockerServiceDefaultNetwork:
  {
    name: 'default-nw',
    ipam_config:
      [{ subnet: '192.168.10.0/24', gateway: '192.168.10.1', iprange: '192.168.10.0/26' }]
  }

# Legacy Portainer variables: kept because playbooks/webserver/rollbackUtils.yaml uses them
# to stop and remove Portainer containers and images still present on existing hosts.
# No Portainer service is deployed anymore.

# Docker Portainer Server service
dockerServicePortainerServerContainerName: 'portainer-server-{{ inventory_hostname }}'
dockerServicePortainerServerImage: 'portainer/portainer-ce:lts'
dockerServicePortainerServerEnvVars: { TZ: 'Europe/Paris', AGENT_SECRET: 'portainer' }
dockerServicePortainerServerPorts: ['9443:9443', '8000:8000']
dockerServicePortainerServerNetworks:
  [
    { name: '{{ dockerServiceDefaultNetwork.name }}' },
    { name: '{{ dockerServiceStandaloneNetwork }}' }
  ]
dockerServicePortainerServerVolumes:
  [
    '/var/run/docker.sock:/var/run/docker.sock',
    '/srv/portainer/data:/data',
    '/etc/localtime:/etc/localtime:ro',
    '/etc/timezone:/etc/timezone:ro'
  ]

# Docker service Portainer
dockerServicePortainerContainerName: 'portainer-agent-{{ inventory_hostname }}'
dockerServicePortainerImage: 'portainer/agent:lts'
dockerServicePortainerPorts: '9001:9001'
dockerServicePortainerCommand: '-H tcp://{{ inventory_hostname }}.lgdweb.ovh:9001 --tlsskipverify'
dockerServicePortainerNetworks: [{ name: '{{ dockerServiceDefaultNetwork.name }}' }]
dockerServicePortainerEnvVars: { TZ: 'Europe/Paris', AGENT_SECRET: 'portainer' }
dockerServicePortainerVolumes:
  [
    '/var/run/docker.sock:/var/run/docker.sock',
    '/var/lib/docker/volumes:/var/lib/docker/volumes',
    '/etc/localtime:/etc/localtime:ro',
    '/etc/timezone:/etc/timezone:ro'
  ]

dockerServicePortainerAgentFirewallPorts: [{ port: 9001, proto: 'tcp' }]

# Docker service Nginx Proxy Manager
dockerServiceProxyContainerName: 'nginx-proxy-manager-{{ inventory_hostname }}'
dockerServiceProxyImage: 'jc21/nginx-proxy-manager:2.16.0'
dockerServiceProxyPorts: ['80:80', '443:443', '127.0.0.1:81:81']
dockerServiceProxyEnvVars: { TZ: 'Europe/Paris' }
dockerServiceProxyNetworks:
  [
    { name: '{{ dockerServiceStandaloneNetwork }}' },
    { name: '{{ dockerServiceDefaultNetwork.name }}' }
  ]
dockerServiceProxyVolumes:
  [
    '/srv/nginx-proxy-manager/data:/data',
    '/srv/logs/nginx-proxy-manager:/data/logs/',
    '/srv/nginx-proxy-manager/data/letsencrypt:/etc/letsencrypt'
  ]

# Docker service Main Site
dockerServiceMainSiteContainerName: 'main-site-{{ inventory_hostname }}'
dockerServiceMainSiteImage: 'lgdweb/nginx-test:latest'
dockerServiceMainSiteNetworks:
  [
    { name: '{{ dockerServiceStandaloneNetwork }}' },
    { name: '{{ dockerServiceDefaultNetwork.name }}' }
  ]
dockerServiceMainSiteVolumes:
  [
    '/srv/logs/nginx:/var/log/nginx',
    '/etc/localtime:/etc/localtime:ro',
    '/etc/timezone:/etc/timezone:ro'
  ]

# ---------------------------------------------------------------------------
# Docker service Arcane — replaces Portainer as the Docker management UI.
# `ansible` is the source of truth; `server-lab-docker-infra` and
# `docker-data-server-infra` keep an equivalent compose file as a fallback.
# ---------------------------------------------------------------------------

# The master host runs the manager, every docker host runs an agent.
# The manager publishes NO port: Nginx Proxy Manager is its only entry point
# (both containers sit on `default-nw`).
arcaneMasterHost: "{{ (groups['master'] | default([inventory_hostname]))[0] }}"

# The API is only reached through the master, so its URL and the admin API key
# are read from the master vault whatever host is being deployed. This keeps
# the admin key off the witness hosts. Override with
# `-e arcaneManagerApiUrl=http://<container ip>:3552` to bootstrap a manager
# that is not published in Nginx Proxy Manager yet.
arcaneManagerApiUrl: '{{ hostvars[arcaneMasterHost].vaultArcaneManagerApiUrl }}'
arcaneAdminApiKey: '{{ hostvars[arcaneMasterHost].vaultArcaneAdminApiKey }}'

# Docker service Arcane (manager) — hosts of the `master` group only
dockerServiceArcaneServerContainerName: 'arcane-manager-{{ inventory_hostname }}'
dockerServiceArcaneServerImage: 'ghcr.io/getarcaneapp/manager:v2.17.3'
dockerServiceArcaneServerPorts: []
dockerServiceArcaneServerNetworks:
  [{ name: '{{ dockerServiceDefaultNetwork.name }}' }]
dockerServiceArcaneServerVolumes:
  [
    '/var/run/docker.sock:/var/run/docker.sock',
    'arcane-manager-data-{{ inventory_hostname }}:/app/data'
  ]
# PROJECTS_DIRECTORY is deliberately unset: Arcane falls back to its own default
# inside /app/data. No bind mount, no `file` task, no dedicated git repository.
dockerServiceArcaneServerEnvVars:
  TZ: 'Europe/Paris'
  APP_URL: '{{ vaultArcaneServerUrl }}'
  PUID: '1000'
  PGID: '1000'
  ENCRYPTION_KEY: '{{ vaultArcaneEncryptionKey }}'
  ADMIN_STATIC_API_KEY: '{{ vaultArcaneAdminApiKey }}'
  # Nginx Proxy Manager is the only client of the API: trust it and only it, so
  # Arcane logs the real client IP. 192.168.10.0/26 is the iprange of
  # `default-nw`, i.e. the range docker allocates container addresses from.
  TRUSTED_PROXIES: '192.168.10.0/26'

# Docker service Arcane (agent) — every docker host
dockerServiceArcaneAgentContainerName: 'arcane-agent-{{ inventory_hostname }}'
dockerServiceArcaneAgentImage: 'ghcr.io/getarcaneapp/agent:v2.17.3'
dockerServiceArcaneAgentVolumes:
  [
    '/var/run/docker.sock:/var/run/docker.sock',
    'arcane-agent-data-{{ inventory_hostname }}:/app/data'
  ]
dockerServiceArcaneAgentNetworks:
  [{ name: '{{ dockerServiceDefaultNetwork.name }}' }]
# AGENT_TOKEN is NOT set here on purpose: it is obtained from the manager API at
# runtime by `roles/arcane/bootstrap` and merged into the container env by
# `playbooks/arcane/install.yaml`. The token is never written to a var file.
dockerServiceArcaneAgentEnvVars:
  TZ: 'Europe/Paris'
  MANAGER_API_URL: '{{ arcaneManagerApiUrl }}'
  EDGE_AGENT: 'true'
  EDGE_TRANSPORT: 'poll'
  AGENT_MODE: 'true'
  PORT: '3553'
