# ansible_path/group_vars/docker.yaml

# Docker installation
dockerAptRepoUri: 'https://raw.githubusercontent.com/TituxMetal/cffa/main/apt/docker.list'
dockerAptRepoName: docker
dockerPackages:
  [
    'docker-ce',
    'docker-ce-cli',
    'containerd.io',
    'docker-buildx-plugin',
    'docker-compose-plugin',
    'python3-docker'
  ]
dockerAptKeyUri: https://download.docker.com/linux/debian/gpg

# Docker rollback behaviour: when true, the rollback stops every running container and
# removes /var/lib/docker and /var/lib/containerd (destructive: test hosts only).
# This value is the default; playbooks/docker/rollback.yaml redeclares it in its play vars
# so it can be switched per run without touching the command line.
dockerRollbackPurgeData: false
