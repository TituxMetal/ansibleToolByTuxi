# ansible_path/group_vars/docker.yaml

# Docker installation
dockerAptRepoUri: 'https://raw.githubusercontent.com/TituxMetal/cffa/main/apt/docker.list'
dockerAptRepoName: docker
dockerPackages:
  [
    'docker-ce',
    'docker-ce-cli',
    'containerd.io',
    'docker-buildx-plugin',
    'docker-compose-plugin',
    'python3-docker'
  ]
dockerAptKeyUri: https://download.docker.com/linux/debian/gpg

# Rollback switches for the docker objects. Both are aliases of the single
# `rollbackPurgeData` decision, defined in group_vars/all.yaml: the decision is
# taken in one place, the roles keep their own variable names.
#
# dockerRollbackPurgeData: stop every container, then remove /var/lib/docker
# and /var/lib/containerd.
# dockerRollbackRemoveVolumes: remove the named volumes handed to
# rollbacks/docker/volume.
dockerRollbackPurgeData: '{{ rollbackPurgeData }}'
dockerRollbackRemoveVolumes: '{{ rollbackPurgeData }}'
