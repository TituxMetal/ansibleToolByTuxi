# ansible_path/group_vars/docker.yaml

# Docker installation
dockerAptRepoUri: 'https://raw.githubusercontent.com/TituxMetal/cffa/main/apt/docker.list'
dockerAptRepoName: docker
dockerPackages:
  [
    'docker-ce',
    'docker-ce-cli',
    'containerd.io',
    'docker-buildx-plugin',
    'docker-compose-plugin',
    'python3-docker'
  ]
dockerAptKeyUri: https://download.docker.com/linux/debian/gpg
