# ansible_path/playbooks/docker/rollback.yaml
---
- name: ROLLBACK DOCKER INSTALL | Uninstall Docker
  hosts: docker
  become: true
  vars:
    # Legacy cleanup only: these three Swarm ports were opened on every host by
    # older versions of docker/install. install.yaml no longer opens them, so
    # keeping the deny here is what actually strips the leftover rules.
    dockerPorts:
      [{ port: 2377, proto: 'tcp' }, { port: 7946, proto: 'any' }, { port: 4789, proto: 'udp' }]
  roles:
    # Stop containers and remove docker data when dockerRollbackPurgeData is true
    - role: rollbacks/docker/data

    # Remove Docker packages and dependencies
    - { role: rollbacks/apt/remove, aptPackages: '{{ dockerPackages }}' }

    # Remove Docker apt repository
    - { role: rollbacks/apt/repository, aptRepoName: '{{ dockerAptRepoName }}' }

    # Remove Docker Gpg keyring file
    - { role: rollbacks/apt/keys, aptRepoName: '{{ dockerAptRepoName }}' }

    # Remove Docker group
    - { role: rollbacks/users/group, userGroup: docker }

    # Deny ports in firewall
    - { role: rollbacks/firewall/deny, firewallPorts: '{{ dockerPorts }}' }
