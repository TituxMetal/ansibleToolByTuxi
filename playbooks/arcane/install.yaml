# ansible_path/playbooks/arcane/install.yaml
---
# Two plays, one per container kind, deployed by the same command: the manager
# on the master first, the agents on every other docker host second, so a
# manager answers before an agent tries to enrol.
#
# Rule: `Arcane` is deployed by the generic roles (no compose file in Ansible),
# the enrollment token is fetched from the manager API at run time (never
# entered by hand), and the manager publishes no port (Nginx Proxy Manager is
# its only entry).
- name: ARCANE INSTALL | Install the manager on the master
  hosts: master
  gather_facts: false
  vars:
    eximDestEmail: me@lgdweb.fr
    eximEmailSubject: 'Ansible arcane install task done on server'
    eximEmailBody: 'All Arcane install tasks are done successfully'
  roles:
    # Create default network if it does not exist yet
    - role: roles/docker/network
      projectAppNetworkName: '{{ dockerServiceDefaultNetwork.name }}'
      projectAppNetworkIpamConfig: '{{ dockerServiceDefaultNetwork.ipam_config }}'
      tags: [arcane, network]

    - role: roles/docker/image
      projectAppImageName: '{{ dockerServiceArcaneServerImage }}'
      tags: [arcane, arcaneServer]

    - role: roles/docker/container
      projectAppContainerName: '{{ dockerServiceArcaneServerContainerName }}'
      projectAppImageName: '{{ dockerServiceArcaneServerImage }}'
      projectAppEnvVars: '{{ dockerServiceArcaneServerEnvVars }}'
      projectAppVolumes: '{{ dockerServiceArcaneServerVolumes }}'
      projectAppNetworks: '{{ dockerServiceArcaneServerNetworks }}'
      projectAppPorts: '{{ dockerServiceArcaneServerPorts }}'
      projectAppRestartPolicy: 'always'
      # The env carries ENCRYPTION_KEY and ADMIN_STATIC_API_KEY: never printed.
      no_log: true
      tags: [arcane, arcaneServer]

    # Wait for /api/health before an agent is allowed to talk to the API
    - role: roles/arcane/health
      tags: [arcane, arcaneServer]

    # Sending Notification email
    - role: roles/exim/sendemail
      tags: [exim, sendemail]

# The master keeps an agent like every other docker host: the manager also
# registers its own Docker socket (the local environment, id `0`), so the
# master ends up with two environments under the same hostname. Work happens
# on the agent one.
- name: ARCANE INSTALL | Install the agents on every docker host
  hosts: docker
  gather_facts: false
  roles:
    # Resolves `arcaneAgentToken` from the reusable enrollment token the
    # manager keeps, creating it when it does not exist yet. The token never
    # leaves the run.
    - role: roles/arcane/bootstrap
      tags: [arcane, arcaneAgent]

    - role: roles/docker/image
      projectAppImageName: '{{ dockerServiceArcaneAgentImage }}'
      tags: [arcane, arcaneAgent]

    - role: roles/docker/container
      projectAppContainerName: '{{ dockerServiceArcaneAgentContainerName }}'
      projectAppImageName: '{{ dockerServiceArcaneAgentImage }}'
      projectAppEnvVars: '{{ dockerServiceArcaneAgentEnvVars | combine({"ARCANE_AGENT_TOKEN": arcaneAgentToken}) }}'
      projectAppVolumes: '{{ dockerServiceArcaneAgentVolumes }}'
      projectAppNetworks: '{{ dockerServiceArcaneAgentNetworks }}'
      projectAppRestartPolicy: 'always'
      no_log: true
      tags: [arcane, arcaneAgent]

    # Wait for the environment to be reported `connected`
    - role: roles/arcane/verify
      tags: [arcane, arcaneVerify]
