# ansible_path/playbooks/arcane/rollback.yaml
---
# Order matters: the environment is unregistered while the manager still
# answers, then the containers, then the volumes and the images.
#
# Containers, volumes and images are the generic docker objects: they are
# removed by the `rollbacks/docker/*` roles, with the same names
# `playbooks/arcane/install.yaml` uses to create them. The environment is the
# only part that talks to the Arcane API.
- name: ARCANE ROLLBACK | Uninstall Arcane
  hosts: docker
  gather_facts: false
  roles:
    # Unregister the environment of this host from the manager
    - role: rollbacks/arcane/environment

    # The agent first, the manager it depends on second
    - role: rollbacks/docker/container
      vars:
        projectAppContainerName: '{{ dockerServiceArcaneAgentContainerName }}'

    - role: rollbacks/docker/container
      vars:
        projectAppContainerName: '{{ dockerServiceArcaneServerContainerName }}'

    # The agent volume carries the projects, the manager volume the users and
    # the environments. Both follow `rollbackPurgeData`.
    - role: rollbacks/docker/volume
      vars:
        dockerRollbackVolumeNames:
          - '{{ dockerServiceArcaneAgentDataVolumeName }}'
          - '{{ dockerServiceArcaneServerDataVolumeName }}'

    - role: rollbacks/docker/image
      vars:
        projectAppImageName: '{{ dockerServiceArcaneAgentImage }}'

    - role: rollbacks/docker/image
      vars:
        projectAppImageName: '{{ dockerServiceArcaneServerImage }}'
