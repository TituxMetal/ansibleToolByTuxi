# ansible_path/rollbacks/system/unattendedUpgrades/tasks/main.yaml
---
- name: ROLLBACK SYSTEM UNATTENDEDUPGRADES | Stop and disable the report timer
  ansible.builtin.systemd_service:
    name: patch-report.timer
    enabled: false
    state: stopped
  tags: [rollback, unattended-upgrades, report]

- name: ROLLBACK SYSTEM UNATTENDEDUPGRADES | Remove the report units and timer overrides
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  with_items:
    - /etc/systemd/system/patch-report.service
    - /etc/systemd/system/patch-report.timer
    - /etc/systemd/system/apt-daily.timer.d/schedule.conf
    - /etc/systemd/system/apt-daily-upgrade.timer.d/schedule.conf
  tags: [rollback, unattended-upgrades, schedule]

- name: ROLLBACK SYSTEM UNATTENDEDUPGRADES | Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  tags: [rollback, unattended-upgrades, schedule]

- name: ROLLBACK SYSTEM UNATTENDEDUPGRADES | Remove the report script and its stamp
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  with_items:
    - '{{ patchReportBin }}/patch-report'
    - '{{ patchReportBin | dirname }}/.cache/patch-report.stamp'
  tags: [rollback, unattended-upgrades, report]

- name: ROLLBACK SYSTEM UNATTENDEDUPGRADES | Remove the apt configuration
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  with_items:
    - /etc/apt/apt.conf.d/22ansible-auto-upgrades
    - /etc/apt/apt.conf.d/52ansible-unattended-upgrades
  tags: [rollback, unattended-upgrades, apt-config]
