# ansible_path/rollbacks/dockerServices/dataStructure/tasks/main.yaml
---
# `mainDataDirectory` holds the proxy configuration with its TLS material, the
# ban database and the logs. Removing it is a destructive act, not a rollback
# step, so it is guarded by `rollbackPurgeData` (group_vars/all.yaml, false by
# default).
- name: DOCKER SERVICE DATA STRUCTURE ROLLBACK | Remove main data structure directory
  become: true
  ansible.builtin.file:
    path: '{{ mainDataDirectory }}'
    state: absent
  when: rollbackPurgeData | bool
  tags: [rollbacks, dockerService, dataStructure]

- name: DOCKER SERVICE DATA STRUCTURE ROLLBACK | Remove tmp data structure directory
  become: true
  ansible.builtin.file:
    path: '{{ tempDataDirectory }}'
    state: absent
  when: rollbackPurgeData | bool
  tags: [rollbacks, dockerService, dataStructure]

# Guard rail, run only when the purge is off: the rollback is allowed to remove
# containers and images, never this state. A regression that wipes it fails the
# play here instead of passing silently.
- name: DOCKER SERVICE DATA STRUCTURE ROLLBACK | Check the state a rollback must keep
  ansible.builtin.stat:
    path: '{{ mainDataDirectory }}/{{ item }}'
  loop: '{{ dataStructureProtectedFiles }}'
  loop_control:
    label: '{{ item }}'
  register: dataStructureProtectedState
  when: not (rollbackPurgeData | bool)
  tags: [rollbacks, dockerService, dataStructure]

- name: DOCKER SERVICE DATA STRUCTURE ROLLBACK | Assert the state a rollback must keep
  ansible.builtin.assert:
    that: item.stat.exists | default(false)
    fail_msg: >-
      {{ mainDataDirectory }}/{{ item.item }} is gone after the rollback. The
      rollback was only allowed to remove containers and images: restore the
      file before running anything else, then fix the guard.
    quiet: true
  loop: '{{ dataStructureProtectedState.results | default([]) }}'
  loop_control:
    label: '{{ item.item }}'
  when: not (rollbackPurgeData | bool)
  tags: [rollbacks, dockerService, dataStructure]
