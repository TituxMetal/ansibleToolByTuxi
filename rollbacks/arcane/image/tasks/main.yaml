# ansible_path/rollbacks/arcane/image/tasks/main.yaml
---
- name: ROLLBACK ARCANE IMAGE | Remove the Arcane images
  community.docker.docker_image:
    name: '{{ item }}'
    state: absent
    force_absent: true
  loop: '{{ arcaneRollbackImages }}'
  loop_control:
    label: '{{ item }}'
  tags: [rollback, arcane, removeImage]
