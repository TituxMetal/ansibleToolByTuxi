# ansible_path/rollbacks/arcane/container/defaults/main.yaml

# The server container only exists on the master host; removing a container that
# is not there is a no-op, so both names are always listed.
arcaneRollbackContainerNames:
  [
    'arcane-agent-{{ inventory_hostname }}',
    'arcane-manager-{{ inventory_hostname }}'
  ]
arcaneRollbackVolumeNames:
  [
    'arcane-agent-data-{{ inventory_hostname }}',
    'arcane-manager-data-{{ inventory_hostname }}'
  ]
# Named volumes hold the manager database (users, settings, environments) and
# the agent identity. Removing them is destructive: opt-in only.
arcaneRollbackRemoveVolumes: false
